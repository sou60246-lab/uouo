<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドイツ語単語テスト</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f14;
    --surface: #1a1a24;
    --card: #22223a;
    --accent: #c4a35a;
    --accent2: #7b61ff;
    --correct: #4caf8a;
    --wrong: #e05c5c;
    --text: #e8e8f0;
    --muted: #7a7a9a;
    --border: #2e2e48;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  header {
    text-align: center;
    padding: 32px 0 20px;
    width: 100%;
    max-width: 700px;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 5px;
  }
  header p { color: var(--muted); font-size: 0.82rem; }
  .container { width: 100%; max-width: 700px; }

  /* ── SETUP ── */
  .setup-section { margin-bottom: 22px; }
  .setup-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .select-controls { display: flex; gap: 8px; margin-bottom: 10px; }
  .ctrl-btn {
    padding: 5px 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.76rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }

  .set-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 9px;
  }
  .set-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 13px;
    padding: 14px 12px;
    cursor: pointer;
    transition: all 0.16s;
    text-align: center;
    position: relative;
    user-select: none;
  }
  .set-card:hover { border-color: var(--accent2); }
  .set-card.selected { border-color: var(--accent); background: rgba(196,163,90,0.09); }
  .set-card .snum { font-family: 'Playfair Display', serif; font-size: 1.7rem; color: var(--accent); display: block; line-height: 1; }
  .set-card .slabel { font-size: 0.76rem; color: var(--text); margin-top: 4px; display: block; }
  .set-card .scount { font-size: 0.69rem; color: var(--muted); margin-top: 2px; display: block; }
  .ckmark { display: none; position: absolute; top: 7px; right: 9px; color: var(--accent); font-size: 0.8rem; }
  .set-card.selected .ckmark { display: block; }

  .summary-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 13px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 6px;
  }
  .sum-text { font-size: 0.85rem; color: var(--muted); }
  .sum-text b { color: var(--text); }
  .start-btn {
    padding: 11px 28px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), #e0b84a);
    color: #0f0f14;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.92rem;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .start-btn:hover { opacity: 0.85; }
  .start-btn:disabled { opacity: 0.32; cursor: not-allowed; }

  /* ── QUIZ ── */
  .back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.8rem;
    padding: 6px 13px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 16px;
    transition: all 0.15s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  .set-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 14px; }
  .set-tag {
    background: rgba(196,163,90,0.1);
    border: 1px solid rgba(196,163,90,0.28);
    color: var(--accent);
    font-size: 0.72rem;
    padding: 2px 9px;
    border-radius: 20px;
  }
  .prog-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 18px; overflow: hidden; }
  .prog-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.4s ease; }
  .stats { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); margin-bottom: 14px; }
  .stats b { color: var(--text); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 30px 32px 28px;
    text-align: center;
    margin-bottom: 16px;
    animation: fadeUp 0.28s ease;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .q-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 14px; }
  .q-word { font-family: 'Playfair Display', serif; font-size: 1.9rem; color: var(--text); line-height: 1.3; margin-bottom: 6px; }
  .q-sub { font-size: 0.83rem; color: var(--muted); }
  .set-badge { display: inline-block; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 0.67rem; padding: 2px 8px; border-radius: 9px; margin-top: 9px; }

  /* Step indicator */
  .step-indicator {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 18px 0 6px;
  }
  .step-dot {
    width: 28px; height: 4px;
    border-radius: 2px;
    background: var(--border);
    transition: background 0.2s;
  }
  .step-dot.active { background: var(--accent); }
  .step-dot.done { background: var(--correct); }

  /* Article buttons */
  .article-btns { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .art-btn {
    padding: 13px 30px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--surface);
    color: var(--text);
    font-family: 'Playfair Display', serif;
    font-size: 1.35rem;
    cursor: pointer;
    transition: all 0.17s;
    min-width: 90px;
  }
  .art-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
  .art-btn:disabled { cursor: default; }
  .art-btn.correct { background: rgba(76,175,138,0.15); border-color: var(--correct); color: var(--correct); }
  .art-btn.wrong   { background: rgba(224,92,92,0.10);  border-color: var(--wrong);   color: var(--wrong); }
  .art-btn.reveal  { background: rgba(76,175,138,0.10); border-color: var(--correct); color: var(--correct); }

  /* Text input */
  .input-wrap { display: flex; gap: 9px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
  .ans-input {
    flex: 1; min-width: 180px;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--surface);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .ans-input:focus { border-color: var(--accent); }
  .ans-input.correct { border-color: var(--correct); background: rgba(76,175,138,0.07); }
  .ans-input.wrong   { border-color: var(--wrong);   background: rgba(224,92,92,0.07); }
  .ans-input:disabled { opacity: 0.6; }
  .check-btn {
    padding: 12px 22px;
    border: none; border-radius: 11px;
    background: var(--accent); color: #0f0f14;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.92rem; font-weight: 500;
    cursor: pointer; transition: opacity 0.2s;
  }
  .check-btn:hover { opacity: 0.85; }

  /* Feedback */
  .feedback {
    margin-top: 14px; padding: 11px 16px;
    border-radius: 11px; font-size: 0.86rem;
    display: none; animation: fadeUp 0.18s ease; text-align: left;
  }
  .feedback.correct { background: rgba(76,175,138,0.09); border: 1px solid var(--correct); color: var(--correct); }
  .feedback.wrong   { background: rgba(224,92,92,0.07);  border: 1px solid var(--wrong);   color: var(--wrong); }
  .feedback.info    { background: rgba(123,97,255,0.08); border: 1px solid var(--accent2); color: #a89aff; }

  /* Answer reveal box */
  .answer-reveal {
    margin-top: 10px; padding: 10px 16px;
    border-radius: 11px;
    background: rgba(196,163,90,0.07);
    border: 1px solid rgba(196,163,90,0.25);
    font-size: 0.88rem; color: var(--accent);
    display: none; text-align: center;
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
  }

  .next-btn {
    display: none; width: 100%;
    padding: 14px; border: none; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), #e0b84a);
    color: #0f0f14;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.92rem; font-weight: 500;
    cursor: pointer; margin-top: 10px; transition: opacity 0.2s;
  }
  .next-btn:hover { opacity: 0.88; }

  /* ── RESULT ── */
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 40px 32px;
    text-align: center;
    animation: fadeUp 0.35s ease;
  }
  .result-card h2 { font-family: 'Playfair Display', serif; font-size: 1.7rem; color: var(--accent); margin-bottom: 8px; }
  .score-big { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--text); margin: 16px 0; }
  .score-big span { font-size: 1.5rem; color: var(--muted); }
  .result-msg { color: var(--muted); font-size: 0.9rem; margin-bottom: 22px; }
  .wrong-list { text-align: left; margin-top: 22px; border-top: 1px solid var(--border); padding-top: 18px; }
  .wl-title { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 10px; }
  .wrong-item {
    padding: 10px 0; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 8px; flex-wrap: wrap;
  }
  .wi-q { font-size: 0.85rem; color: var(--muted); }
  .wi-right { text-align: right; }
  .wi-user { font-size: 0.82rem; color: var(--wrong); }
  .wi-correct { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--correct); }
  .wi-badge { font-size: 0.68rem; color: var(--muted); }

  .res-btns { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; justify-content: center; }
  .restart-btn {
    padding: 13px 32px; border: none; border-radius: 11px;
    background: var(--accent); color: #0f0f14;
    font-family: 'Noto Sans JP', sans-serif; font-size: 0.92rem; font-weight: 500;
    cursor: pointer; transition: opacity 0.2s;
  }
  .restart-btn:hover { opacity: 0.85; }
  .back-top-btn {
    padding: 13px 22px; border: 1px solid var(--border); border-radius: 11px;
    background: transparent; color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif; font-size: 0.92rem;
    cursor: pointer; transition: all 0.2s;
  }
  .back-top-btn:hover { border-color: var(--accent); color: var(--accent); }

  .divider { height: 1px; background: var(--border); margin: 18px 0; }
  footer { margin-top: 32px; color: var(--muted); font-size: 0.72rem; text-align: center; padding-bottom: 16px; }

  /* ── TABS ── */
  .tab-bar {
    display: flex;
    gap: 6px;
    width: 100%;
    max-width: 700px;
    margin-bottom: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 5px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 8px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    line-height: 1.3;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    background: var(--card);
    color: var(--accent);
    font-weight: 500;
    border: 1px solid var(--border);
  }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  @media (max-width: 480px) {
    .card { padding: 22px 18px 20px; }
    .q-word { font-size: 1.6rem; }
    .art-btn { padding: 11px 22px; font-size: 1.2rem; }
    header h1 { font-size: 1.7rem; }
    .tab-btn { font-size: 0.74rem; padding: 8px 4px; }
  }
</style>
<style>
.stat-box{margin:10px 0;padding:10px 12px;border:1px solid rgba(128,128,128,.3);border-radius:10px;font-size:.88rem;line-height:1.7}
.stat-h{margin:14px 0 4px;font-weight:700;font-size:.9rem}
.stat-row{display:flex;justify-content:space-between;gap:8px;padding:3px 2px;border-bottom:1px solid rgba(128,128,128,.15);font-size:.82rem}
.stat-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>

</head>
<body>

<header>
  <h1>Deutsch Vokabeltest</h1>
  <p>ドイツ語単語テスト</p>
</header>

<!-- ── TAB BAR ── -->
<div class="tab-bar" id="main-tab-bar">
  <button class="tab-btn active" onclick="switchTab('normal')" id="tab-normal">📚 通常単語集</button>
  <button class="tab-btn" onclick="switchTab('exam')" id="tab-exam">📝 期末2-1対策</button>
</div>

<!-- ── TAB: 通常 ── -->
<div class="tab-pane active" id="pane-normal">

<!-- ── SETUP ── -->
<div class="container" id="setup-area">
  <div class="setup-section">
    <div class="setup-label">単語集を選ぶ</div>
    <div class="select-controls">
      <button class="ctrl-btn" onclick="selectAll()">すべて選択</button>
      <button class="ctrl-btn" onclick="selectNone()">選択解除</button>
    </div>
    <div class="set-grid" id="set-grid"></div>
  </div>
  <div class="divider"></div>
  <div class="summary-bar">
    <div class="sum-text" id="sum-text">単語集を選択してください</div>
    <button class="start-btn" id="start-btn" onclick="startQuiz()" disabled>テスト開始</button>
  </div>
  <div class="divider"></div>
  <div class="select-controls" style="flex-wrap:wrap">
    <button class="ctrl-btn" id="review-btn" onclick="startReview()">🔁 間違えた単語を復習</button>
    <button class="ctrl-btn" onclick="toggleStats()">📊 学習記録</button>
  </div>
  <div id="stats-panel" style="display:none"></div>

</div>

<!-- ── QUIZ ── -->
<div class="container" id="quiz-area" style="display:none;">
  <button class="back-btn" onclick="goSetup()">← 設定に戻る</button>
  <div class="set-tags" id="set-tags"></div>
  <div class="prog-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
  <div class="stats">
    <span>問題 <b id="q-num">1</b> / <b id="q-tot">?</b></span>
    <span>正解 <b id="score-now">0</b></span>
  </div>
  <div class="card" id="q-card">
    <div class="q-label" id="q-label"></div>
    <div class="q-word" id="q-word"></div>
    <div class="q-sub"  id="q-sub"></div>
    <div class="set-badge" id="q-badge"></div>

    <!-- 名詞: ステップ1 定冠詞 -->
    <div id="step-article" style="display:none;">
      <div class="step-indicator">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot"        id="dot2"></div>
      </div>
      <div class="article-btns">
        <button class="art-btn" onclick="answerArticle('der')">der</button>
        <button class="art-btn" onclick="answerArticle('die')">die</button>
        <button class="art-btn" onclick="answerArticle('das')">das</button>
      </div>
    </div>

    <!-- 名詞: ステップ2 単語入力 -->
    <div id="step-word" style="display:none;">
      <div class="step-indicator">
        <div class="step-dot done"   id="dot1b"></div>
        <div class="step-dot active" id="dot2b"></div>
      </div>
      <div style="margin-top:6px; font-size:0.82rem; color:var(--muted);" id="article-result-label"></div>
      <div class="input-wrap">
        <input class="ans-input" type="text" id="word-input"
          placeholder="単語を入力（例: Tisch/e）"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="check-btn" onclick="checkWord()">確認</button>
      </div>
    </div>

    <!-- 名詞以外: テキスト入力 -->
    <div id="step-other" style="display:none;">
      <div class="input-wrap">
        <input class="ans-input" type="text" id="other-input"
          placeholder="ドイツ語を入力…"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="check-btn" onclick="checkOther()">確認</button>
      </div>
    </div>

    <div style="margin-top:10px;text-align:center"><button class="ctrl-btn" id="skip-btn" onclick="skipQ()">答えだけ確認（わかる単語）</button></div>
    <div class="feedback" id="feedback"></div>
    <div class="answer-reveal" id="answer-reveal"></div>
    <button class="next-btn" id="next-btn" onclick="nextQ()">次の問題 →</button>
  </div>
</div>

<!-- ── RESULT ── -->
<div class="container" id="result-area" style="display:none;">
  <div class="result-card">
    <h2>テスト完了！</h2>
    <div class="score-big" id="res-score">0<span>/0</span></div>
    <div class="result-msg" id="res-msg"></div>
    <div class="wrong-list" id="wrong-list"></div>
    <div class="res-btns">
      <button class="restart-btn" onclick="restartSame()">同じ設定でもう一度</button>
      <button class="back-top-btn" onclick="goSetup()">設定に戻る</button>
    </div>
  </div>
</div>

</div><!-- /pane-normal -->

<!-- ── TAB: 期末2-1対策 ── -->
<div class="tab-pane" id="pane-exam">
<div class="container" id="exam-setup-area">
  <div class="setup-section">
    <div class="setup-label">📝 期末2-1対策 — 単語一覧テスト</div>
  </div>
  <div class="divider"></div>
  <div class="summary-bar">
    <div class="sum-text" id="exam-sum-text">全<b id="exam-word-count">0</b>語収録</div>
    <button class="start-btn" onclick="startExamQuiz()">テスト開始</button>
  </div>
</div>

<div class="container" id="exam-quiz-area" style="display:none;">
  <button class="back-btn" onclick="goExamSetup()">← 設定に戻る</button>
  <div class="set-tags"><span class="set-tag">📝 期末2-1対策</span></div>
  <div class="prog-wrap"><div class="prog-bar" id="exam-prog-bar" style="width:0%"></div></div>
  <div class="stats">
    <span>問題 <b id="exam-q-num">1</b> / <b id="exam-q-tot">?</b></span>
    <span>正解 <b id="exam-score-now">0</b></span>
  </div>
  <div class="card">
    <div class="q-label" id="exam-q-label"></div>
    <div class="q-word" id="exam-q-word"></div>
    <div class="q-sub"  id="exam-q-sub"></div>

    <div id="exam-step-article" style="display:none;">
      <div class="step-indicator">
        <div class="step-dot active"></div>
        <div class="step-dot" id="exam-dot2"></div>
      </div>
      <div class="article-btns">
        <button class="art-btn" onclick="examAnswerArticle('der')">der</button>
        <button class="art-btn" onclick="examAnswerArticle('die')">die</button>
        <button class="art-btn" onclick="examAnswerArticle('das')">das</button>
      </div>
    </div>

    <div id="exam-step-word" style="display:none;">
      <div class="step-indicator">
        <div class="step-dot done"></div>
        <div class="step-dot active"></div>
      </div>
      <div style="margin-top:6px; font-size:0.82rem; color:var(--muted);" id="exam-article-result-label"></div>
      <div class="input-wrap">
        <input class="ans-input" type="text" id="exam-word-input"
          placeholder="単語を入力（例: Tisch/e）"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="check-btn" onclick="examCheckWord()">確認</button>
      </div>
    </div>

    <div id="exam-step-other" style="display:none;">
      <div class="input-wrap">
        <input class="ans-input" type="text" id="exam-other-input"
          placeholder="ドイツ語を入力…"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="check-btn" onclick="examCheckOther()">確認</button>
      </div>
    </div>

    <div class="feedback" id="exam-feedback"></div>
    <div class="answer-reveal" id="exam-answer-reveal"></div>
    <button class="next-btn" id="exam-next-btn" onclick="examNextQ()">次の問題 →</button>

let selectedSets = new Set();
let questions = [], current = 0, score = 0;
let wrongAnswers = [], lastSets = null;

// 現在の問題の状態
let articleCorrect = false;   // ステップ1の結果
let chosenArticle  = '';      // ユーザーが選んだ定冠詞

function init() {
  const grid = document.getElementById('set-grid');
  grid.innerHTML = '';
  Object.keys(WORD_SETS).map(Number).sort((a,b)=>a-b).forEach(num => {
    const s = WORD_SETS[num];
    const el = document.createElement('div');
    el.className = 'set-card';
    el.id = 'sc-' + num;
    el.onclick = () => toggleSet(num);
    el.innerHTML = `<span class="ckmark">✓</span>
      <span class="snum">${num}</span>
      <span class="slabel">${s.label}</span>
      <span class="scount">${s.words.length}語</span>`;
    grid.appendChild(el);
  });
  updateSummary();
}

function toggleSet(n) {
  selectedSets.has(n) ? selectedSets.delete(n) : selectedSets.add(n);
  document.getElementById('sc-'+n).classList.toggle('selected', selectedSets.has(n));
  updateSummary();
}
function selectAll()  { Object.keys(WORD_SETS).map(Number).forEach(n => { selectedSets.add(n); document.getElementById('sc-'+n).classList.add('selected'); }); updateSummary(); }
function selectNone() { selectedSets.forEach(n => { const e=document.getElementById('sc-'+n); if(e) e.classList.remove('selected'); }); selectedSets.clear(); updateSummary(); }

function updateSummary() {
  updateReviewBtn();
  const btn = document.getElementById('start-btn');
  const txt = document.getElementById('sum-text');
  if (!selectedSets.size) { txt.innerHTML='単語集を選択してください'; btn.disabled=true; return; }
  const sorted = [...selectedSets].sort((a,b)=>a-b);
  let total = 0;
  sorted.forEach(n => total += WORD_SETS[n].words.length);
  txt.innerHTML = `単語集 <b>${sorted.join('・')}</b> ／ <b>${total}問</b>`;
  btn.disabled = false;
}

function startQuiz() {
  lastSets = new Set(selectedSets);
  let pool = [];
  [...selectedSets].sort((a,b)=>a-b).forEach(n =>
    pool = pool.concat(WORD_SETS[n].words.map(w => ({...w, setNum:n}))));
  pool = thinKnown(pool); reviewMode = false; skipped = 0;
  questions = shuffle(pool);
  current = 0; score = 0; wrongAnswers = [];

  const sorted = [...selectedSets].sort((a,b)=>a-b);
  document.getElementById('set-tags').innerHTML =
    sorted.map(n=>`<span class="set-tag">No.${n} ${WORD_SETS[n].label}</span>`).join('');

  show('quiz-area');
  showQ();
}

function showQ() {
  const q = questions[current];
  const total = questions.length;
  document.getElementById('q-num').textContent = current+1;
  document.getElementById('q-tot').textContent = total;
  document.getElementById('score-now').textContent = score;
  document.getElementById('prog-bar').style.width = (current/total*100)+'%';
  document.getElementById('q-badge').textContent = `No.${q.setNum} ${WORD_SETS[q.setNum].label}`;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('answer-reveal').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('skip-btn').style.display = 'inline-block';

  // 全パネル非表示
  ['step-article','step-word','step-other'].forEach(id =>
    document.getElementById(id).style.display = 'none');

  articleCorrect = false;
  chosenArticle = '';

  if (q.gender) {
    // 名詞: ステップ1へ
    document.getElementById('q-label').textContent = '① 定冠詞を選んでください';
    document.getElementById('q-word').textContent = q.jp;
    document.getElementById('q-sub').textContent = '';
    document.querySelectorAll('.art-btn').forEach(b => { b.className='art-btn'; b.disabled=false; });
    document.getElementById('step-article').style.display = 'block';
  } else {
    // 名詞以外
    document.getElementById('q-label').textContent = 'ドイツ語を入力してください';
    document.getElementById('q-word').textContent = q.jp;
    document.getElementById('q-sub').textContent = '';
    const inp = document.getElementById('other-input');
    inp.value=''; inp.className='ans-input'; inp.disabled=false;
    document.getElementById('step-other').style.display = 'block';
    setTimeout(()=>inp.focus(), 50);
  }
}

// ── 名詞ステップ1: 定冠詞 ──
function answerArticle(selected) {
  const q = questions[current];
  chosenArticle = selected;
  document.getElementById('skip-btn').style.display = 'none';
  articleCorrect = (selected === q.gender);

  document.querySelectorAll('.art-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.gender) b.classList.add('reveal');
    if (b.textContent === selected) b.classList.add(articleCorrect ? 'correct' : 'wrong');
  });

  // ステップ2へ自動遷移（少し待つ）
  setTimeout(() => {
    document.getElementById('step-article').style.display = 'none';
    document.getElementById('q-label').textContent = '② 単語（複数形）を入力してください';

    const label = document.getElementById('article-result-label');
    if (articleCorrect) {
      label.innerHTML = `<span style="color:var(--correct)">✓ ${q.gender}</span> は正解！　次は単語を入力`;
    } else {
      label.innerHTML = `<span style="color:var(--wrong)">✗ ${selected}</span>　正解は <span style="color:var(--correct)">${q.gender}</span>　続けて単語を入力`;
    }

    const inp = document.getElementById('word-input');
    inp.value=''; inp.className='ans-input'; inp.disabled=false;
    document.getElementById('step-word').style.display = 'block';
    setTimeout(()=>inp.focus(), 50);
  }, 700);
}

// ── 名詞ステップ2: 単語入力 ──
function checkWord() {
  const q = questions[current];
  const inp = document.getElementById('word-input');
  const userRaw = inp.value.trim();
  if (!userRaw) return;

  inp.disabled = true;
  const norm = normDe;
  const wordCorrect = norm(userRaw) === norm(q.de);

  // 正解判定: 両ステップ正解のみ◯
  const fullyCorrect = articleCorrect && wordCorrect;

  if (fullyCorrect) {
    score++; recordResult(q,true);
    document.getElementById('score-now').textContent = score;
    inp.classList.add('correct');
    showFeedback('correct', `完璧！ ${q.gender} ${q.de} ＝ ${q.jp}`);
  } else {
    inp.classList.add('wrong');
    const parts = [];
    if (!articleCorrect) parts.push(`定冠詞: ${chosenArticle} → 正解 ${q.gender}`);
    if (!wordCorrect) parts.push(`単語: ${userRaw} → 正解 ${q.de}`);
    recordResult(q,false); wrongAnswers.push({ q, articleOk: articleCorrect, wordOk: wordCorrect,
      userArticle: chosenArticle, userWord: userRaw });
    showFeedback('wrong', `不正解。 ` + parts.join('　'));
    document.getElementById('answer-reveal').textContent = `正解: ${q.gender} ${q.de}`;
    document.getElementById('answer-reveal').style.display = 'block';
  }

  document.getElementById('next-btn').style.display = 'block';
  document.getElementById('skip-btn').style.display = 'none';
}

// ── 名詞以外 ──
function checkOther() {
  const q = questions[current];
  const inp = document.getElementById('other-input');
  const userRaw = inp.value.trim();
  if (!userRaw) return;

  inp.disabled = true;
  const norm = s => normDe(s.replace(/^(der|die|das)\s+/i,''));
  const ok = norm(userRaw) === norm(q.de);

  if (ok) {
    score++; recordResult(q,true);
    document.getElementById('score-now').textContent = score;
    inp.classList.add('correct');
    showFeedback('correct', `正解！ ${q.de} ＝ ${q.jp}`);
  } else {
    inp.classList.add('wrong');
    recordResult(q,false); wrongAnswers.push({ q, articleOk: true, wordOk: false,
      userArticle: '', userWord: userRaw });
    showFeedback('wrong', `不正解。正解は「${q.de}」`);
    document.getElementById('answer-reveal').textContent = `正解: ${q.de}`;
    document.getElementById('answer-reveal').style.display = 'block';
  }

  document.getElementById('next-btn').style.display = 'block';
  document.getElementById('skip-btn').style.display = 'none';
}

// Enterキー対応
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (currentTab === 'normal') {
    const ws = document.getElementById('step-word');
    const os = document.getElementById('step-other');
    const nb = document.getElementById('next-btn');
    if (ws.style.display !== 'none' && !document.getElementById('word-input').disabled) checkWord();
    else if (os.style.display !== 'none' && !document.getElementById('other-input').disabled) checkOther();
    else if (nb.style.display !== 'none') nextQ();
  }
});

function showFeedback(type, msg) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback ' + type;
  el.style.display = 'block';
}

function nextQ() {
  if (++current >= questions.length) showResult();
  else showQ();
}

// ── 結果 ──
function showResult() {
  show('result-area');
  const total = questions.length - skipped;
  document.getElementById('res-score').innerHTML = score + '<span>/' + total + '</span>';
  const pct = total ? Math.round(score/total*100) : 100;
  document.getElementById('res-msg').textContent =
    (pct===100 ? '🎉 パーフェクト！' : pct>=80 ? '✨ よくできました！' : pct>=60 ? '📖 もう少し！' : '💪 復習してもう一度！')
    + ` (${pct}%)`;

  if (skipped) document.getElementById('res-msg').textContent += ` ／ 既知スキップ ${skipped}語`;
  const wl = document.getElementById('wrong-list');
  if (!wrongAnswers.length) { wl.innerHTML=''; return; }
  wl.innerHTML = '<div class="wl-title">間違えた単語</div>' +
    wrongAnswers.map(w => {
      const isNoun = w.q.gender !== null;
      const qText = w.q.jp;
      let detail = '';
      if (isNoun) {
        if (!w.articleOk) detail += `<span style="color:var(--wrong)">定冠詞×</span> `;
        if (!w.wordOk)    detail += `<span style="color:var(--wrong)">単語×</span>`;
      } else {
        detail = `<span style="color:var(--wrong)">${w.userWord}</span>`;
      }
      return `<div class="wrong-item">
        <div><div class="wi-q">${qText}</div><div style="font-size:0.72rem;color:var(--muted)">No.${w.q.setNum}</div></div>
        <div class="wi-right">
          <div class="wi-correct">${isNoun ? w.q.gender+' ' : ''}${w.q.de}</div>
          <div class="wi-user">${detail}</div>
        </div>
      </div>`;
    }).join('');
}

function restartSame() { if (reviewMode) { startReview(); return; } selectedSets = new Set(lastSets); startQuiz(); }
function goSetup() {
  show('setup-area');
  Object.keys(WORD_SETS).map(Number).forEach(n => {
    const e = document.getElementById('sc-'+n);
    if(e) e.classList.toggle('selected', selectedSets.has(n));
  });
  updateSummary();
}

function show(id) {
  ['setup-area','quiz-area','result-area'].forEach(i =>
    document.getElementById(i).style.display = i===id ? 'block' : 'none');
  const bar = document.getElementById('main-tab-bar');
  bar.style.display = (id === 'setup-area') ? 'flex' : 'none';
}
function shuffle(a) {
  const arr=[...a];
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

// ================================================================
//  学習記録（localStorage）・復習・既知スキップ
// ================================================================
const REC_KEY = 'dowa_records_v1';
let reviewMode = false, skipped = 0;
const normDe = s => s.toLowerCase().replace(/\.\.\.|…/g,'').replace(/ß/g,'ss')
  .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/\s+/g,' ').trim();
const ymd = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const today = () => ymd(new Date());
const wkey = w => w.setNum+'|'+w.de+'|'+w.jp;
function loadRec() {
  try { const d = JSON.parse(localStorage.getItem(REC_KEY)); if (d && d.words && d.days) return d; } catch(_) {}
  return { words:{}, days:{} };
}
function saveRec(d) { try { localStorage.setItem(REC_KEY, JSON.stringify(d)); } catch(_) {} }
function wrec(d, q) { return d.words[wkey(q)] || (d.words[wkey(q)] = { ok:0, ng:0, known:false, lastWrong:false }); }
function recordResult(q, ok) {
  const d = loadRec(), r = wrec(d, q), t = d.days[today()] || (d.days[today()] = { n:0, ok:0 });
  if (ok) { r.ok++; r.lastWrong = false; } else { r.ng++; r.lastWrong = true; r.known = false; }
  r.last = today(); t.n++; if (ok) t.ok++;
  saveRec(d);
}
function thinKnown(pool) {
  const d = loadRec();
  const f = pool.filter(w => { const r = d.words[wkey(w)]; return !(r && r.known) || Math.random() < 0.25; });
  return f.length ? f : pool;
}
function skipQ() {
  const q = questions[current], d = loadRec();
  wrec(d, q).known = true; saveRec(d); skipped++;
  document.getElementById('skip-btn').style.display = 'none';
  ['step-article','step-word','step-other'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('q-label').textContent = '答えの確認（既知として記録しました）';
  showFeedback('correct', `${q.gender ? q.gender+' ' : ''}${q.de} ＝ ${q.jp}`);
  document.getElementById('next-btn').style.display = 'block';
}
function reviewWords() {
  const d = loadRec(), out = [];
  Object.keys(WORD_SETS).map(Number).sort((a,b)=>a-b).forEach(n => WORD_SETS[n].words.forEach(w => {
    const r = d.words[n+'|'+w.de+'|'+w.jp]; if (r && r.lastWrong) out.push({ ...w, setNum:n });
  }));
  return out;
}
function updateReviewBtn() {
  const b = document.getElementById('review-btn'); if (!b) return;
  const n = reviewWords().length;
  b.textContent = `🔁 間違えた単語を復習（${n}語）`; b.disabled = !n;
}
function startReview() {
  const pool = reviewWords();
  if (!pool.length) { alert('復習する単語はありません'); goSetup(); return; }
  reviewMode = true; skipped = 0; current = 0; score = 0; wrongAnswers = [];
  questions = shuffle(pool);
  document.getElementById('set-tags').innerHTML = '<span class="set-tag">復習モード（間違えた単語）</span>';
  show('quiz-area'); showQ();
}
function toggleStats() {
  const p = document.getElementById('stats-panel');
  if (p.style.display === 'none') { renderStats(); p.style.display = 'block'; } else p.style.display = 'none';
}
function renderStats() {
  const d = loadRec(), pc = (a,b) => b ? Math.round(a/b*100)+'%' : '-';
  let n = 0, ok = 0; Object.values(d.days).forEach(v => { n += v.n; ok += v.ok; });
  const t = d.days[today()] || { n:0, ok:0 };
  let h = `<div class="stat-box"><b>今日</b> ${t.n}問／正解${t.ok}（${pc(t.ok,t.n)}）<br><b>累計</b> ${n}問／正解${ok}（${pc(ok,n)}）</div><div class="stat-h">直近7日</div>`;
  for (let i = 0; i < 7; i++) {
    const dt = new Date(); dt.setDate(dt.getDate()-i); const k = ymd(dt), v = d.days[k] || { n:0, ok:0 };
    h += `<div class="stat-row"><span>${k}</span><span>${v.n}問／正解${v.ok}（${pc(v.ok,v.n)}）</span></div>`;
  }
  h += '<div class="stat-h">単語集ごと</div>';
  Object.keys(WORD_SETS).map(Number).sort((a,b)=>a-b).forEach(s => {
    let st = 0, kn = 0, o = 0, g = 0;
    WORD_SETS[s].words.forEach(w => { const r = d.words[s+'|'+w.de+'|'+w.jp]; if (r) { st++; o += r.ok; g += r.ng; if (r.known) kn++; } });
    h += `<div class="stat-row"><span>No.${s} ${WORD_SETS[s].label}</span><span>学習${st}/${WORD_SETS[s].words.length}語・既知${kn}・正答率${pc(o,o+g)}</span></div>`;
  });
  const weak = [];
  Object.keys(WORD_SETS).map(Number).forEach(s => WORD_SETS[s].words.forEach(w => {
    const r = d.words[s+'|'+w.de+'|'+w.jp]; if (r && r.ng) weak.push({ w, r });
  }));
  weak.sort((a,b) => b.r.ng - a.r.ng);
  h += '<div class="stat-h">苦手な単語（上位10）</div>' + (weak.slice(0,10).map(x =>
    `<div class="stat-row"><span>${x.w.gender ? x.w.gender+' ' : ''}${x.w.de}（${x.w.jp}）</span><span>不正解${x.r.ng}／正解${x.r.ok}</span></div>`).join('') || '<div class="stat-row">まだありません</div>');
  h += `<div class="stat-btns"><button class="ctrl-btn" onclick="exportRec()">記録を書き出す</button>
    <button class="ctrl-btn" onclick="document.getElementById('rec-file').click()">記録を読み込む</button>
    <button class="ctrl-btn" onclick="resetRec()">記録をリセット</button>
    <input type="file" id="rec-file" accept=".json" style="display:none" onchange="importRec(event)"></div>`;
  document.getElementById('stats-panel').innerHTML = h;
}
function exportRec() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(loadRec())], { type:'application/json' }));
  a.download = 'dowa-records-'+today()+'.json'; a.click();
}
function importRec(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try {
    const d = JSON.parse(r.result); if (!d.words || !d.days) throw 0;
    if (confirm('現在の記録を、読み込んだ記録で置き換えます。よろしいですか？')) { saveRec(d); renderStats(); updateReviewBtn(); }
  } catch(_) { alert('記録ファイルを読み込めませんでした'); } };
  r.readAsText(f); e.target.value = '';
}
function resetRec() {
  if (confirm('学習記録をすべて消去します。よろしいですか？')) { saveRec({ words:{}, days:{} }); renderStats(); updateReviewBtn(); }
}

// ── タブ切り替え ──
let currentTab = 'normal';
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-normal').classList.toggle('active', tab === 'normal');
  document.getElementById('tab-exam').classList.toggle('active', tab === 'exam');
  document.getElementById('pane-normal').classList.toggle('active', tab === 'normal');
  document.getElementById('pane-exam').classList.toggle('active', tab === 'exam');
  // タブバーをクイズ中は非表示
  const bar = document.getElementById('main-tab-bar');
  bar.style.display = 'flex';
}

// ── 期末クイズ ──
let examQuestions = [], examCurrent = 0, examScore = 0;
let examWrong = [];
let examArticleCorrect = false, examChosenArticle = '';
let examAnswered = false;

function initExam() {
  document.getElementById('exam-word-count').textContent = EXAM_WORDS.length;
}

function startExamQuiz() {
  examQuestions = shuffle([...EXAM_WORDS]);
  examCurrent = 0; examScore = 0; examWrong = []; examAnswered = false;
  examShowArea('exam-quiz-area');
  document.getElementById('main-tab-bar').style.display = 'none';
  examShowQ();
}

function examShowQ() {
  const q = examQuestions[examCurrent];
  const total = examQuestions.length;
  document.getElementById('exam-q-num').textContent = examCurrent + 1;
  document.getElementById('exam-q-tot').textContent = total;
  document.getElementById('exam-score-now').textContent = examScore;
  document.getElementById('exam-prog-bar').style.width = (examCurrent / total * 100) + '%';
  document.getElementById('exam-feedback').style.display = 'none';
  document.getElementById('exam-feedback').className = 'feedback';
  document.getElementById('exam-answer-reveal').style.display = 'none';
  document.getElementById('exam-next-btn').style.display = 'none';
  ['exam-step-article','exam-step-word','exam-step-other'].forEach(id =>
    document.getElementById(id).style.display = 'none');
  examArticleCorrect = false; examChosenArticle = ''; examAnswered = false;

  if (q.gender) {
    document.getElementById('exam-q-label').textContent = '① 定冠詞を選んでください';
    document.getElementById('exam-q-word').textContent = q.jp;
    document.getElementById('exam-q-sub').textContent = '';
    document.querySelectorAll('#exam-step-article .art-btn').forEach(b => { b.className='art-btn'; b.disabled=false; });
    document.getElementById('exam-step-article').style.display = 'block';
  } else {
    document.getElementById('exam-q-label').textContent = 'ドイツ語を入力してください';
    document.getElementById('exam-q-word').textContent = q.jp;
    document.getElementById('exam-q-sub').textContent = '';
    const inp = document.getElementById('exam-other-input');
    inp.value=''; inp.className='ans-input'; inp.disabled=false;
    document.getElementById('exam-step-other').style.display = 'block';
    setTimeout(() => inp.focus(), 50);
  }
}

function examAnswerArticle(selected) {
  if (examAnswered) return;
  const q = examQuestions[examCurrent];
  examChosenArticle = selected;
  examArticleCorrect = (selected === q.gender);
  document.querySelectorAll('#exam-step-article .art-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.gender) b.classList.add('reveal');
    if (b.textContent === selected) b.classList.add(examArticleCorrect ? 'correct' : 'wrong');
  });
  setTimeout(() => {
    document.getElementById('exam-step-article').style.display = 'none';
    document.getElementById('exam-q-label').textContent = '② 単語（複数形）を入力してください';
    const label = document.getElementById('exam-article-result-label');
    label.innerHTML = examArticleCorrect
      ? `<span style="color:var(--correct)">✓ ${q.gender}</span> は正解！　次は単語を入力`
      : `<span style="color:var(--wrong)">✗ ${selected}</span>　正解は <span style="color:var(--correct)">${q.gender}</span>　続けて単語を入力`;
    const inp = document.getElementById('exam-word-input');
    inp.value=''; inp.className='ans-input'; inp.disabled=false;
    document.getElementById('exam-step-word').style.display = 'block';
    setTimeout(() => inp.focus(), 50);
  }, 700);
}

function examCheckWord() {
  if (examAnswered) return;
  const q = examQuestions[examCurrent];
  const inp = document.getElementById('exam-word-input');
  const userRaw = inp.value.trim();
  if (!userRaw) return;
  examAnswered = true; inp.disabled = true;
  const norm = s => s.toLowerCase().replace(/\.\.\./g,'').trim();
  const wordOk = norm(userRaw) === norm(q.de);
  const fullyOk = examArticleCorrect && wordOk;
  if (fullyOk) {
    examScore++;
    document.getElementById('exam-score-now').textContent = examScore;
    inp.classList.add('correct');
    examShowFeedback('correct', `完璧！ ${q.gender} ${q.de} ＝ ${q.jp}`);
  } else {
    inp.classList.add('wrong');
    const parts = [];
    if (!examArticleCorrect) parts.push(`定冠詞: ${examChosenArticle} → 正解 ${q.gender}`);
    if (!wordOk) parts.push(`単語: ${userRaw} → 正解 ${q.de}`);
    examWrong.push({ q, articleOk: examArticleCorrect, wordOk, userArticle: examChosenArticle, userWord: userRaw });
    examShowFeedback('wrong', '不正解。' + parts.join('　'));
    document.getElementById('exam-answer-reveal').textContent = `正解: ${q.gender} ${q.de}`;
    document.getElementById('exam-answer-reveal').style.display = 'block';
  }
  document.getElementById('exam-next-btn').style.display = 'block';
}

function examCheckOther() {
  if (examAnswered) return;
  const q = examQuestions[examCurrent];
  const inp = document.getElementById('exam-other-input');
  const userRaw = inp.value.trim();
  if (!userRaw) return;
  examAnswered = true; inp.disabled = true;
  const norm = s => s.toLowerCase().replace(/^(der|die|das)\s+/i,'').replace(/\.\.\./g,'').trim();
  const ok = norm(userRaw) === norm(q.de);
  if (ok) {
    examScore++;
    document.getElementById('exam-score-now').textContent = examScore;
    inp.classList.add('correct');
    examShowFeedback('correct', `正解！ ${q.de} ＝ ${q.jp}`);
  } else {
    inp.classList.add('wrong');
    examWrong.push({ q, articleOk: true, wordOk: false, userArticle: '', userWord: userRaw });
    examShowFeedback('wrong', `不正解。正解は「${q.de}」`);
    document.getElementById('exam-answer-reveal').textContent = `正解: ${q.de}`;
    document.getElementById('exam-answer-reveal').style.display = 'block';
  }
  document.getElementById('exam-next-btn').style.display = 'block';
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (currentTab === 'exam') {
    const ws = document.getElementById('exam-step-word');
    const os = document.getElementById('exam-step-other');
    const nb = document.getElementById('exam-next-btn');
    if (ws.style.display !== 'none' && !document.getElementById('exam-word-input').disabled) examCheckWord();
    else if (os.style.display !== 'none' && !document.getElementById('exam-other-input').disabled) examCheckOther();
    else if (nb.style.display !== 'none') examNextQ();
  }
});

function examShowFeedback(type, msg) {
  const el = document.getElementById('exam-feedback');
  el.textContent = msg; el.className = 'feedback ' + type; el.style.display = 'block';
}

function examNextQ() {
  if (++examCurrent >= examQuestions.length) examShowResult();
  else examShowQ();
}

function examShowResult() {
  examShowArea('exam-result-area');
  document.getElementById('main-tab-bar').style.display = 'none';
  const total = examQuestions.length;
  document.getElementById('exam-res-score').innerHTML = examScore + '<span>/' + total + '</span>';
  const pct = Math.round(examScore / total * 100);
  document.getElementById('exam-res-msg').textContent =
    (pct===100?'🎉 パーフェクト！':pct>=80?'✨ よくできました！':pct>=60?'📖 もう少し！':'💪 復習してもう一度！') + ` (${pct}%)`;
  const wl = document.getElementById('exam-wrong-list');
  if (!examWrong.length) { wl.innerHTML=''; return; }
  wl.innerHTML = '<div class="wl-title">間違えた単語</div>' +
    examWrong.map(w => {
      const isNoun = w.q.gender !== null;
      let detail = isNoun
        ? (!w.articleOk ? '<span style="color:var(--wrong)">定冠詞×</span> ' : '') + (!w.wordOk ? '<span style="color:var(--wrong)">単語×</span>' : '')
        : `<span style="color:var(--wrong)">${w.userWord}</span>`;
      return `<div class="wrong-item">
        <div><div class="wi-q">${w.q.jp}</div></div>
        <div class="wi-right">
          <div class="wi-correct">${isNoun ? w.q.gender+' ' : ''}${w.q.de}</div>
          <div class="wi-user">${detail}</div>
        </div>
      </div>`;
    }).join('');
}

function goExamSetup() {
  examShowArea('exam-setup-area');
  document.getElementById('main-tab-bar').style.display = 'flex';
}

function examShowArea(id) {
  ['exam-setup-area','exam-quiz-area','exam-result-area'].forEach(i =>
    document.getElementById(i).style.display = i===id ? 'block' : 'none');
}

initExam();
